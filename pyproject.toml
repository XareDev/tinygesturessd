[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tinygesturessd"
version = "0.3.0"
description = "Single-scale SSDLite hand-gesture detector for ESP32-S3 / ESP-DL"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Youcef Harmouni" },
  { name = "Abdelaziz Bellili" },
  { name = "Walid Touzout" },
]
keywords = ["tinyML", "ESP32-S3", "ESP-DL", "SSDLite", "gesture-detection", "quantization"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# torch / torchvision are intentionally not core dependencies: install the wheel
# that matches your CUDA driver first, then `pip install -e ".[torch]"`.
dependencies = [
  "datasets>=2.18,<3.0",
  "huggingface_hub>=0.22",
  "mediapipe>=0.10.14",
  "scikit-learn>=1.4",
  "Pillow>=10.2",
  "matplotlib>=3.8",
  "tqdm>=4.66",
  "numpy>=1.26,<2.0",
  "onnx>=1.15",
  "onnxruntime>=1.17",
]

[project.optional-dependencies]
torch = ["torch>=2.0", "torchvision>=0.15"]
dev = ["pytest>=8.0"]

[project.urls]
Repository = "https://github.com/XareDev/tinygesturessd"
Paper = "https://github.com/XareDev/tinygesturessd/blob/main/docs/paper/paper.pdf"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["tinygesturessd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
